# ============================================================
# SugarCheck — despliegue con Docker Compose
#
# Las imágenes se construyen en tu PC y se suben a Docker Hub.
# El servidor solo hace `pull`.
#
# En tu PC:      ./deploy/push.sh
# En el server:  ./deploy/update.sh
#
# Requiere un .env en la raíz con DOCKERHUB_USER=tu-usuario
# y backend/.env con las variables de la aplicación.
# ============================================================

name: sugarcheck

services:
  # ----------------------------------------------------------
  # Migraciones de Prisma. Usa la MISMA imagen que `api`.
  # Corre una vez y termina; `api` espera a que salga con 0.
  # ----------------------------------------------------------
  migrate:
    image: ${DOCKERHUB_USER:-gayer12}/sugarcheck:api
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    env_file: ./backend/.env
    restart: "no"

  # ----------------------------------------------------------
  # API NestJS (solo accesible desde la red interna de Docker)
  # ----------------------------------------------------------
  api:
    image: ${DOCKERHUB_USER:-gayer12}/sugarcheck:api
    build:
      context: ./backend
    env_file: ./backend/.env
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(()=>process.exit(0)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------
  # Frontend estático + Caddy (HTTPS automático)
  # ----------------------------------------------------------
  web:
    image: ${DOCKERHUB_USER:-gayer12}/sugarcheck:web
    build:
      context: ./frontend
      args:
        # Cambia esto si cambias de dominio (y reconstruye la imagen).
        VITE_BACKEND_URL: https://sugarcheck.duckdns.org
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
